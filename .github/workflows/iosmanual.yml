name: Run iOS Build (manual)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        default: "ios"
        type: string

env:
  # Adjust if your fork names the iOS project differently
  # (spaces are fine, they're quoted below).
  XCODE_PROJECT: "RSDKv5.xcodeproj"
  XCODE_SCHEME: "RSDKv5"
  CONFIGURATION: Release

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive

      - name: Locate Xcode project
        id: locate
        run: |
          PROJ=$(find . -maxdepth 3 -name "$XCODE_PROJECT" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PROJ" ]; then
            echo "::error::Could not find '$XCODE_PROJECT'. Available projects:"
            find . -maxdepth 3 -name "*.xcodeproj"
            exit 1
          fi
          echo "path=$PROJ" >> "$GITHUB_OUTPUT"
          echo "Using $PROJ"

      - name: Patch project - depend on SDL Framework-iOS
        run: |
          # RSDKv5 had no explicit target dependencies, so Xcode picked SDL's
          # macOS "Framework" target (Cocoa.h error). Add an explicit
          # dependency on "Framework-iOS". Safe to re-run (idempotent).
          cat > /tmp/patch_pbxproj.py <<'PYEOF'
          import os, re, sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          if "AA01 /* PBXContainerItemProxy */" in s:
              print("already patched"); sys.exit(0)

          # The target ID of SDL's "Framework-iOS" lives in SDL's own project file.
          proj_dir = os.path.dirname(os.path.dirname(os.path.abspath(p)))
          sdl_path = os.path.join(proj_dir, "dependencies/ios/SDL/Xcode/SDL/SDL.xcodeproj/project.pbxproj")
          sdl = open(sdl_path, encoding="utf-8").read()
          m = re.search(r"([0-9A-F]{24}) /\* Framework-iOS \*/ = \{\s*isa = PBXNativeTarget;", sdl)
          if not m:
              sys.exit("Could not find PBXNativeTarget 'Framework-iOS' in " + sdl_path)
          IOS_TARGET = m.group(1)
          print("Framework-iOS target id:", IOS_TARGET)

          SDL_PROJ = "F2F153952A070C3400C57723"   # SDL.xcodeproj file reference in RSDKv5
          PROXY, DEP = "F2AB00012B0000010000AA01", "F2AB00022B0000010000AA02"

          proxy = f"""\t\t{PROXY} /* PBXContainerItemProxy */ = {{
          \t\t\tisa = PBXContainerItemProxy;
          \t\t\tcontainerPortal = {SDL_PROJ} /* SDL.xcodeproj */;
          \t\t\tproxyType = 1;
          \t\t\tremoteGlobalIDString = {IOS_TARGET};
          \t\t\tremoteInfo = "Framework-iOS";
          \t\t}};
          """
          s = s.replace("/* Begin PBXContainerItemProxy section */\n",
                        "/* Begin PBXContainerItemProxy section */\n" + proxy, 1)

          if "/* Begin PBXTargetDependency section */" in s:
              sys.exit("PBXTargetDependency section already exists - needs manual merge")
          dep = f"""/* Begin PBXTargetDependency section */
          \t\t{DEP} /* PBXTargetDependency */ = {{
          \t\t\tisa = PBXTargetDependency;
          \t\t\tname = "Framework-iOS";
          \t\t\ttargetProxy = {PROXY} /* PBXContainerItemProxy */;
          \t\t}};
          /* End PBXTargetDependency section */

          """
          marker = "/* Begin PBXVariantGroup section */"
          if marker not in s:
              marker = "/* Begin XCBuildConfiguration section */"
          s = s.replace(marker, dep + marker, 1)

          pat = re.compile(r"(isa = PBXNativeTarget;(?:(?!isa = PBXNativeTarget;).)*?dependencies = \()(\s*)(\);\s*name = RSDKv5;)", re.S)
          s, n = pat.subn(lambda m: f"{m.group(1)}\n\t\t\t\t{DEP} /* PBXTargetDependency */,\n\t\t\t{m.group(3)}", s, count=1)
          if n != 1:
              sys.exit("RSDKv5 target not found")
          open(p, "w", encoding="utf-8").write(s)
          print("patched")
          PYEOF
          python3 /tmp/patch_pbxproj.py "${{ steps.locate.outputs.path }}/project.pbxproj"

      - name: Ensure RSDKv5/Info.plist exists
        run: |
          # The project references RSDKv5/Info.plist but it isn't in the repo,
          # which fails the build. Create a minimal one (Xcode merges in the
          # rest from the INFOPLIST_KEY_* build settings).
          # UIFileSharingEnabled lets you drop Data.rsdk into the app's
          # Documents folder via Files / Finder.
          PROJ_DIR="$(dirname "${{ steps.locate.outputs.path }}")"
          PLIST="$PROJ_DIR/RSDKv5/Info.plist"
          if [ ! -f "$PLIST" ]; then
            mkdir -p "$(dirname "$PLIST")"
            cat > "$PLIST" <<'PLISTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>UIFileSharingEnabled</key>
              <true/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>
          </dict>
          </plist>
          PLISTEOF
            echo "Created $PLIST"
          else
            echo "$PLIST already exists"
          fi

      - name: Patch source - load mods from Documents (iOS)
        run: |
          # On iOS the engine looked for mods in the app bundle (Data/mods).
          # Point it at the Documents folder instead, and create Documents/mods.
          PROJ_DIR="$(dirname "${{ steps.locate.outputs.path }}")"
          cat > /tmp/patch_src.py <<'PYEOF'
          import sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          MARK = "// mods-in-documents patch"
          if MARK in s:
              print("already patched"); sys.exit(0)

          old = '    sprintf_s(SKU::appFileDir, sizeof(SKU::appFileDir), "%s/Data/", getAppResourcesPath());\n'
          if s.count(old) != 1:
              sys.exit("appFileDir line not found exactly once - source changed, patch needs updating")

          new = f'''#if RETRO_PLATFORM == RETRO_iOS
              {MARK}
              // Mods live in the Documents folder (same place as Data.rsdk), not in the
              // read-only app bundle. appFileDir is only used to find the "mods" folder.
              sprintf_s(SKU::appFileDir, sizeof(SKU::appFileDir), "%s", SKU::userFileDir);
              {{
                  char modsDir[0x200];
                  sprintf_s(modsDir, sizeof(modsDir), "%smods", SKU::userFileDir);
                  mkdir(modsDir, 0755); // create Documents/mods so it shows up in Files
              }}
          #else
          {old}#endif
          '''
          s = s.replace(old, new, 1)

          inc = '#include "RSDK/Core/RetroEngine.hpp"\n'
          if s.count(inc) < 1:
              sys.exit("include line not found")
          s = s.replace(inc, inc + "#include <sys/stat.h>\n", 1)
          open(p, "w", encoding="utf-8").write(s)
          print("patched")
          PYEOF
          python3 /tmp/patch_src.py "$PROJ_DIR/RSDKv5/RSDK/User/Core/UserStorage.cpp"

      - name: Ensure Settings.bundle/Root.plist exists
        run: |
          # Settings.bundle is in the repo but its Root.plist (which defines the
          # toggle in the iPhone Settings app) is not, so the option vanished.
          # The engine reads the "PLUS_DLC" boolean from user defaults.
          PROJ_DIR="$(dirname "${{ steps.locate.outputs.path }}")"
          PLIST="$PROJ_DIR/RSDKv5/Settings.bundle/Root.plist"
          if [ ! -f "$PLIST" ]; then
            mkdir -p "$(dirname "$PLIST")"
            cat > "$PLIST" <<'PLISTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>StringsTable</key>
              <string>Root</string>
              <key>PreferenceSpecifiers</key>
              <array>
                  <dict>
                      <key>Type</key>
                      <string>PSToggleSwitchSpecifier</string>
                      <key>Title</key>
                      <string>Mania Plus Content</string>
                      <key>Key</key>
                      <string>PLUS_DLC</string>
                      <key>DefaultValue</key>
                      <false/>
                  </dict>
              </array>
          </dict>
          </plist>
          PLISTEOF
            echo "Created $PLIST"
          else
            echo "$PLIST already exists"
          fi

      - name: Patch source - OpenGL ES renderer (video shaders)
        run: |
          # The stock iOS renderer (SDL + Metal) has shaders hard-disabled.
          # This swaps in an OpenGL ES 2 renderer. The script is committed to
          # the repo at .github/scripts/patch_gles.py (same branch as this file).
          PROJ_DIR="$(dirname "${{ steps.locate.outputs.path }}")"
          SCRIPT="$GITHUB_WORKSPACE/.github/scripts/patch_gles.py"
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::Missing .github/scripts/patch_gles.py - add it to the branch being built"
            exit 1
          fi
          python3 "$SCRIPT" "$PROJ_DIR"

      - name: List schemes (debug aid)
        run: xcodebuild -list -project "${{ steps.locate.outputs.path }}"

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project "${{ steps.locate.outputs.path }}" \
            -scheme "$XCODE_SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            OTHER_LDFLAGS='$(inherited) -framework OpenGLES' \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          # Only accept an app built for a real iPhone/iPad
          APP=$(find build/Build/Products -path "*iphoneos*" -name "*.app" -type d -maxdepth 3 | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::No iphoneos .app produced"
            find build/Build/Products -maxdepth 3
            exit 1
          fi
          echo "Packaging $APP"
          ls -la "$APP"
          if [ ! -f "$APP/Info.plist" ]; then
            echo "::error::$APP has no Info.plist - the build did not produce a real app"
            exit 1
          fi
          # Never bundle game data (Data.rsdk) - copy it into the
          # app's Documents folder on-device instead.
          find "$APP" -name "Data.rsdk" -delete
          # Mods must not live inside the (read-only) app bundle.
          echo "Bundled Data/ before cleanup:"; ls -la "$APP/Data" 2>/dev/null || true
          rm -rf "$APP/Data/mods"
          # Bundle the OpenGL shader sources (loaded from <app>/Shaders/OGL when
          # they are not found in Data.rsdk / Documents/Data).
          SHADERS_SRC="$(dirname "${{ steps.locate.outputs.path }}")/RSDKv5/Shaders/OGL"
          if [ -d "$SHADERS_SRC" ]; then
            mkdir -p "$APP/Shaders/OGL"
            cp "$SHADERS_SRC"/* "$APP/Shaders/OGL/"
            echo "Bundled shaders:"; ls "$APP/Shaders/OGL"
          else
            echo "::warning::No shader folder at $SHADERS_SRC"
          fi
          echo "Bundled Data/ after cleanup:"; ls -la "$APP/Data" 2>/dev/null || echo "(no Data folder)"
          rm -rf Payload RSDKv5-iOS.ipa
          mkdir Payload
          # ditto preserves symlinks/permissions (plain zip -r can corrupt frameworks)
          ditto "$APP" "Payload/$(basename "$APP")"
          ditto -c -k --sequesterRsrc --keepParent Payload RSDKv5-iOS.ipa
          rm -rf Payload

      - name: Verify IPA
        run: |
          unzip -l RSDKv5-iOS.ipa | head -n 20
          rm -rf verify && mkdir verify && unzip -q RSDKv5-iOS.ipa -d verify
          APP=$(ls -d verify/Payload/*.app)
          plutil -p "$APP/Info.plist" | grep -E "CFBundleExecutable|CFBundleIdentifier|CFBundleSupportedPlatforms|MinimumOSVersion|DTPlatformName"
          EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          test -f "$APP/$EXE" || { echo "::error::Executable $EXE missing"; exit 1; }
          lipo -info "$APP/$EXE"
          vtool -show-build "$APP/$EXE" || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv5-iOS-ipa
          path: RSDKv5-iOS.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
